name: Preserve HHPI reading commit capability
on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['.github/workflows/hhpi-reading-capability-fix.yml']
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'dqtz5vpvj9-create/hapi-dsh' && github.ref == 'refs/heads/feat/hhpi-remote-access-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Apply guarded source changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, unlink } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          if (execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim() !== '60019a113af2bfcea1e2e1de060ebff4bf477f93') throw new Error('Unexpected parent');
          const edit = async (path,before,after,count=1) => { const text=await readFile(path,'utf8'); if(text.split(before).length!==count+1) throw new Error(`Changed source seam: ${path}: ${before}`); await writeFile(path,text.replaceAll(before,after)); };
          await edit('src/client/source-sessions.ts', 'export class SourceSessions implements ISessions {', `export class SourceSessions implements ISessions {
            readonly historySource?: NonNullable<ISessions['historySource']>
            readonly windowCommit?: NonNullable<ISessions['windowCommit']>`);
          await edit('src/client/source-sessions.ts', '  constructor(private readonly original: ISessions) {', `  constructor(private readonly original: ISessions) {
              if (original.historySource) this.historySource = original.historySource
              if (original.windowCommit) this.windowCommit = original.windowCommit`);
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', "import { Context } from '@deepseek-ai/cordis'", "import { Context } from '@deepseek-ai/cordis'\nimport { prepareOfficialBrowserLibrary, resolveOfficialBrowserDependency } from './official-browser-library.ts'");
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', 'return registration.factory(require)', 'return registration.factory(resolveOfficialBrowserDependency)');
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', "  await ctx.plugin(official('@deepseek-ai/dsh-client-ui-renderer'))", "  await prepareOfficialBrowserLibrary()\n  await ctx.plugin(official('@deepseek-ai/dsh-client-ui-renderer'))");
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', '  await remote.refresh()', '  await remote.refresh()\n  assert.equal(sessions.windowCommit, remote.windowCommit, \'outer facade must retain the actual commit coordinator\')');
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', "  for (let i = 0; i < 6; ++i) await a.binding.session.loadOlder()", `  const checkpoints: string[] = []
            assert.ok(a.conversation.windowCommit)
            const stopReader = a.conversation.windowCommit.register(a.binding.viewId!, {
              id: 'actual-occurrence-checkpoint',
              measure: () => { checkpoints.push('measure'); return { revision: 1, anchor: null, following: false, scrollTop: 0, clientHeight: 600, scrollHeight: 10000, nodes: 0, available: false } },
              correct: () => { checkpoints.push('correct') },
            })
            for (let i = 0; i < 6; ++i) await a.binding.session.loadOlder()
            stopReader()
            assert.deepEqual(checkpoints, Array.from({ length: 6 }, () => ['measure', 'correct']).flat())`);
          await unlink('.github/workflows/hhpi-reading-capability-fix.yml');
          NODE
      - name: Commit the capability boundary and contract setup
        run: |
          git diff --check
          git add src/client/source-sessions.ts tests/contracts/hhpi-reading-occurrences.test.ts .github/workflows/hhpi-reading-capability-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hhpi): retain commit coordination through the outer Session facade'
          git push origin HEAD:refs/heads/feat/hhpi-remote-access-20261029
