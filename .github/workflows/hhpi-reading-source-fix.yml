name: Apply HHPI occurrence regression fixes
on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['.github/workflows/hhpi-reading-source-fix.yml']
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'dqtz5vpvj9-create/hapi-dsh' && github.ref == 'refs/heads/feat/hhpi-remote-access-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Apply guarded source corrections
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, rename, unlink } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          if (execFileSync('git', ['rev-parse','HEAD^'], { encoding:'utf8' }).trim() !== '214d2ce8a7764bfc93eddd4a76c437d0ef61f99c') throw new Error('Unexpected correction parent');
          const edit = async (path, before, after, count=1) => { const text = await readFile(path,'utf8'); if(text.split(before).length!==count+1) throw new Error(`Changed correction seam: ${path}`); await writeFile(path,text.replaceAll(before,after)); };
          await rename('src/client/remote-pane.ts', 'src/client/remote-reading-session.ts');
          await edit('src/client/remote-sessions.ts', "'./remote-pane.ts'", "'./remote-reading-session.ts'");
          await edit('src/client/surface/session-view.tsx', "'../remote-pane.ts'", "'../remote-reading-session.ts'");
          await edit('src/client/surface/session-view.tsx', 'const direct = isSourceSessionId(reference.sessionId)', 'const direct = session.readingView !== undefined');
          await edit('src/client/surface/source-window-navigation.tsx', "'../remote-pane.ts'", "'../remote-reading-session.ts'");
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', "'../../src/client/remote-pane.ts'", "'../../src/client/remote-reading-session.ts'");
          await edit('tests/contracts/hhpi-reading-occurrences.test.ts', "      if (!node || node.kind !== 'user') return []\n      return (node.data as { content?: readonly { text?: string }[] }).content?.flatMap(block => block.text === undefined ? [] : [block.text]) ?? []", "      if (!node) return []\n      const data = node.data as { content?: readonly { text?: string }[]; blocks?: readonly { text?: string }[] }\n      return [...(data.content ?? []), ...(data.blocks ?? [])].flatMap(block => typeof block.text === 'string' ? [block.text] : [])");
          await unlink('.github/workflows/hhpi-reading-source-fix.yml');
          NODE
      - run: npm ci
      - name: Existing viewport behavior regressions
        run: node --import tsx --test tests/client-session-viewport.test.ts tests/client-session-preparation.test.ts
      - name: Commit only source fixes
        run: |
          git diff --check
          git add src/client/remote-pane.ts src/client/remote-reading-session.ts src/client/remote-sessions.ts src/client/surface/session-view.tsx src/client/surface/source-window-navigation.tsx tests/contracts/hhpi-reading-occurrences.test.ts .github/workflows/hhpi-reading-source-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hhpi): preserve viewport contracts and unique declaration outputs'
          git push origin HEAD:refs/heads/feat/hhpi-remote-access-20261029
