name: HHPI verified source checkpoint import

on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['.github/workflows/hhpi-source-import-once.yml']

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'dqtz5vpvj9-create/hapi-dsh' && github.ref == 'refs/heads/feat/hhpi-remote-access-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Apply exact locally validated source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6ed236b214d52036176147312cb04ef1c0242673
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = '''
          
          
          
          
          
          
          
          
          vzIgvHQi/jwa3jQdqZjg0jNOhYgoQEDkJOkvBqxMuPDUxulQvFP6Kfrq3wyEQENcu2eb173mSCqT2BlneKC8c1ZefH7O7KpsMGlupoxc/ZRhFOUqm6/ZiNr0kE2ZIjbvrNJcf/8fNt0N5xh2AAA=
          '''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'a21f39a898e54b392a477a64db479ee5c4833fa4c33c8fd45dd4e5485ea013bd'
          path = pathlib.Path('/tmp/hhpi-verified-source.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(path)], check=True)
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Save source checkpoint on the authorized feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/hhpi-remote-access-20261029 | cut -f1)" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(hhpi): wire HAPI-optional Host and Runner sources' -m 'Import checksum-verified source changes already tested locally. Preserve ordinary DSH, route direct source capabilities, and remove the HAPI credential requirement from native-only configuration. This is a backend development checkpoint, not browser acceptance or a production release.'
          git push origin HEAD:refs/heads/feat/hhpi-remote-access-20261029
      - name: Install exact project dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Host types and source behavior checks
        timeout-minutes: 2
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.host.json --noEmit
          node --import tsx --test tests/hhpi-index.test.ts tests/hhpi-ledger.test.ts tests/hhpi-gateway.test.ts tests/hhpi-no-hapi.test.ts tests/config-private.test.ts tests/config-recovery.test.ts
