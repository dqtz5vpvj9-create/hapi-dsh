name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install the official DSH plugin manager prerequisite
        run: npm install --global pnpm@11.28.5
      - name: Install exact dependencies
        run: npm ci
      - uses: ./.github/actions/install-hhpi-extension
      - uses: ./.github/actions/prepare-data-cache
      - name: Types, behavior contracts, component tests, regression fault checks, and build
        run: npm run check
      - name: Unmodified official DSH federation integration
        env:
          HAPI_DSH_OFFICIAL_TESTS: '1'
        run: node --import tsx --test --test-isolation=none tests/federation-official.test.ts
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci
      - uses: ./.github/actions/install-hhpi-extension
      - run: npm run build
      - name: Check and pack distribution
        run: node scripts/distribution-pack.mjs
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hapi-dsh-package
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/INSTALL.md
          if-no-files-found: error
          retention-days: 14
  install-platforms:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: hapi-dsh-package
          path: artifacts
      - name: Install the same tarball through native npm shims and boot the official Host
        env:
          HAPI_DSH_TEST_ROOT: ${{ runner.temp }}/hapi-dsh-package
        run: node scripts/distribution-smoke.mjs
