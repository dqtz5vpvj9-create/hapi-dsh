name: HHPI installed extension integration
on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['src/**', 'tests/**', 'scripts/**', 'source-snapshots/**', 'package*.json', 'tsconfig*.json', '.github/workflows/hhpi-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Verify extension installation boundary
        run: node --test tests/hhpi-extension-install.test.mjs
      - name: Restore exact source-build cache
        id: cached
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/hhpi-ci
          key: hhpi-reading-linux-x64-node24-v1-${{ hashFiles('scripts/dsh-ext/**', 'source-snapshots/dsh-ext/**') }}
      - name: Prepare and build exact source set
        if: steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          mkdir -p .tmp/hhpi-ci .tmp/hhpi-logs
          node scripts/dsh-ext/prepare.mjs "${PWD}/.tmp/hhpi-ci/source" > .tmp/hhpi-ci/source.json
          SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".tmp/hhpi-ci/source.json")).directory)')
          node scripts/dsh-ext/build-extension.mjs "${SOURCE}" "${PWD}/.tmp/hhpi-ci/packages" > .tmp/hhpi-logs/source-build.log 2>&1 || { tail -120 .tmp/hhpi-logs/source-build.log; exit 1; }
          tail -1 .tmp/hhpi-logs/source-build.log
      - name: Save exact source-build cache
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/hhpi-ci
          key: ${{ steps.cached.outputs.cache-primary-key }}
      - name: Install the complete verified extension set
        id: install
        timeout-minutes: 4
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync(".tmp/hhpi-ci/source.json")); fs.appendFileSync(process.env.GITHUB_ENV, `HHPI_DSH_SOURCE=${x.directory}\n`);'
          node scripts/dsh-ext/install-extension.mjs .tmp/hhpi-ci/packages
      - name: Exact official reading and input occurrences
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: node --import tsx --test tests/contracts/hhpi-reading-occurrences.test.ts
      - name: Full Host Client and component typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: npm run typecheck
      - name: Full behavior suite against installed extensions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 6
        run: npm test
      - name: History and fault contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: npm run test:history && npm run test:faults
      - name: Build distributable plugin
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: npm run build
      - name: Confirm tracked dependency inputs were not changed
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: hhpi-installed-extension-identity
          path: |
            .tmp/hhpi-ext/installed.json
            .tmp/hhpi-logs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
