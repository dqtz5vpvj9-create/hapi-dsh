name: HHPI compiler inputs

on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['.github/workflows/hhpi-build-tools.yml']

permissions:
  contents: read

jobs:
  compiler-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact compiler inputs
        run: |
          mkdir -p "${RUNNER_TEMP}/hhpi-compiler"
          cd "${RUNNER_TEMP}/hhpi-compiler"
          npm init -y
          npm install --save-exact tsdown@0.22.2 lightningcss@1.33.0 pnpm@11.28.5
          tar -czf "${RUNNER_TEMP}/hhpi-compiler.tar.gz" package.json package-lock.json node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hhpi-compiler-inputs
          path: ${{ runner.temp }}/hhpi-compiler.tar.gz
          if-no-files-found: error
          retention-days: 3
