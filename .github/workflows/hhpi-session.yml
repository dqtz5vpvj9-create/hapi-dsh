name: HHPI source Session operations
on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['src/client/remote-*.ts', 'src/remote/**', 'tests/hhpi-session-operations.test.ts', 'tests/fixtures/client-session-contract.ts', '.github/workflows/hhpi-session.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci
        timeout-minutes: 5
      - run: node --import tsx --test tests/hhpi-session-operations.test.ts
        timeout-minutes: 1
