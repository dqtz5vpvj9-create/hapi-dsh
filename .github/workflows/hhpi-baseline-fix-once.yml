name: HHPI portable source baseline fix
on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['.github/workflows/hhpi-baseline-fix-once.yml']
permissions:
  contents: read
jobs:
  source-fix:
    if: github.repository == 'dqtz5vpvj9-create/hapi-dsh' && github.ref == 'refs/heads/feat/hhpi-remote-access-20261029'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci
        timeout-minutes: 5
      - name: Apply reviewed source-only corrections and remove this one-time job
        run: node scripts/hhpi-baseline-fix-once.mjs
      - run: git diff --check && npm run test:changed -- --list
      - name: Verify corrected production boundaries without pre-existing build outputs
        timeout-minutes: 2
        run: >-
          node --import tsx --test
          tests/codex-session-controller.test.ts tests/host-bundle-doctor.test.ts
          tests/client-native-late-merge.test.ts tests/codex-history-cache.test.ts
          tests/codex-native.test.ts tests/hapi-agent.test.ts tests/hapi-catalog-startup.test.ts
          tests/hapi-native-library.test.ts tests/hapi-sidechains.test.ts
          tests/source-display-leases.test.ts tests/source-event-queue.test.ts
          tests/source-window-attachments.test.ts tests/hhpi-history-races.test.ts
      - name: Commit only reviewed sources with a normal fast-forward push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/client/remote-history.ts tests/codex-session-controller.test.ts tests/host-bundle-doctor.test.ts tests/fixtures/doctor-package.ts tests/client-native-late-merge.test.ts tests/codex-history-cache.test.ts tests/codex-native.test.ts tests/hapi-agent.test.ts tests/hapi-catalog-startup.test.ts tests/hapi-native-library.test.ts tests/hapi-sidechains.test.ts tests/fixtures/source-event-queue.ts tests/source-window-attachments.test.ts scripts/hhpi-baseline-fix-once.mjs .github/workflows/hhpi-baseline-fix-once.yml
          git commit -m 'fix(hhpi): compile source sequence sets and make regression fixtures portable'
          git push origin HEAD:refs/heads/feat/hhpi-remote-access-20261029
