name: HHPI client contracts

on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['src/client/**', 'src/remote/**', 'tests/hhpi-history*.test.ts', 'tests/contracts/**', 'scripts/**', 'source-snapshots/**', 'package*.json', '.github/workflows/hhpi-client.yml']
  pull_request:
    paths: ['src/client/**', 'src/remote/**', 'tests/hhpi-history*.test.ts', 'tests/contracts/**', 'scripts/**', 'source-snapshots/**', 'package*.json', '.github/workflows/hhpi-client.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install exact dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Show affected test selection
        run: npm run test:changed -- --files src/client/remote-history.ts src/client/history-publication.ts tests/hhpi-history-races.test.ts tests/hhpi-history-publication.test.ts --list
      - name: Source history races and transactional publication
        timeout-minutes: 2
        run: node --import tsx --test tests/hhpi-history-races.test.ts tests/hhpi-history-publication.test.ts
      - name: Prepare the pinned source overlay
        timeout-minutes: 3
        run: |
          node scripts/dsh-ext/prepare.mjs "${RUNNER_TEMP}/hhpi-source" > "${RUNNER_TEMP}/hhpi-source.json"
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync(process.argv[1])); fs.appendFileSync(process.env.GITHUB_ENV, `HHPI_DSH_SOURCE=${x.directory}\n`); console.log(JSON.stringify(x));' "${RUNNER_TEMP}/hhpi-source.json"
      - name: Compile actual official production contracts
        run: node scripts/dsh-ext/build-contracts.mjs "${HHPI_DSH_SOURCE}"
      - name: Official Conversation continuous reading
        timeout-minutes: 2
        run: node --import tsx --test tests/contracts/hhpi-official-history.test.ts tests/contracts/hhpi-reader-anchors.test.ts
