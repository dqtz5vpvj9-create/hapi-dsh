name: HHPI browser debugging workspace
on:
  push:
    branches: [feat/hhpi-remote-access-20261029]
    paths: ['.github/workflows/hhpi-browser-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/hhpi-ci
          key: hhpi-reading-linux-x64-node24-v1-${{ hashFiles('scripts/dsh-ext/**', 'source-snapshots/dsh-ext/**') }}
          fail-on-cache-miss: true
      - run: node scripts/dsh-ext/install-extension.mjs .tmp/hhpi-ci/packages
      - name: Package only source and public browser dependencies
        run: |
          mkdir -p .tmp/browser-workspace
          git archive HEAD | gzip > .tmp/browser-workspace/checkout.tar.gz
          tar -czf .tmp/browser-workspace/dependencies.tar.gz node_modules
          tar --exclude='.git' --exclude='node_modules' -czf .tmp/browser-workspace/source.tar.gz .tmp/hhpi-ci/source .tmp/hhpi-ci/source.json .tmp/hhpi-ext/installed.json
          cp "$(command -v node)" .tmp/browser-workspace/node
          git rev-parse HEAD > .tmp/browser-workspace/commit.txt
          sha256sum .tmp/browser-workspace/* > .tmp/browser-workspace/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hhpi-browser-workspace
          path: .tmp/browser-workspace
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
