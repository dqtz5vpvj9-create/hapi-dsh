name: HHPI bounded official browser lab
on:
  push:
    branches: [main, feat/hhpi-remote-access-20261029]
    paths: ['tests/browser/**', 'tests/contracts/**', 'src/client/**', 'src/remote/**', 'src/shared/**', 'src/session-provider/**', 'src/hhpi-api.ts', 'src/client-api.ts', 'src/build-info.ts', 'src/index.ts', 'package.json', 'package-lock.json', 'tsconfig*.json', 'scripts/dsh-ext/**', 'source-snapshots/dsh-ext/**', '.github/workflows/hhpi-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhpi-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 3
      - name: Restore exact source build
        id: source
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/hhpi-ci
          key: hhpi-reading-linux-x64-node24-v1-${{ hashFiles('scripts/dsh-ext/**', 'source-snapshots/dsh-ext/**') }}
      - name: Build source only on exact cache miss
        if: steps.source.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          mkdir -p .tmp/hhpi-ci .tmp/hhpi-browser/results
          node scripts/dsh-ext/prepare.mjs "${PWD}/.tmp/hhpi-ci/source" > .tmp/hhpi-ci/source.json
          SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".tmp/hhpi-ci/source.json")).directory)')
          node scripts/dsh-ext/build-extension.mjs "$SOURCE" "${PWD}/.tmp/hhpi-ci/packages" > .tmp/hhpi-browser/results/build.log 2>&1 || { tail -100 .tmp/hhpi-browser/results/build.log; exit 1; }
      - name: Install verified official extension set
        timeout-minutes: 3
        run: |
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(".tmp/hhpi-ci/source.json"));fs.appendFileSync(process.env.GITHUB_ENV,`HHPI_DSH_SOURCE=${x.directory}\n`)'
          node scripts/dsh-ext/install-extension.mjs .tmp/hhpi-ci/packages
      - name: Fast simulated DOM contracts
        timeout-minutes: 1
        run: node --import tsx tests/browser/run.mjs --dom
      - name: Install isolated pinned browser tooling
        timeout-minutes: 3
        run: |
          mkdir -p .tmp/hhpi-browser/results
          npm install --prefix .tmp/hhpi-browser-tools --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node .tmp/hhpi-browser-tools/node_modules/playwright/cli.js install --with-deps chromium > .tmp/hhpi-browser/results/browser-install.log 2>&1 || { tail -80 .tmp/hhpi-browser/results/browser-install.log; exit 1; }
      - name: Two bounded reading and Codex rendering journeys
        timeout-minutes: 3
        run: node --import tsx tests/browser/run.mjs --browser
      - name: Publish bounded result diagnostics
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='.tmp/hhpi-browser/results/report.json';
          if(fs.existsSync(path)) {
            const report=JSON.parse(fs.readFileSync(path,'utf8'));
            const escape=text=>text.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
            console.log('::notice title=HHPI browser result::'+escape(JSON.stringify({status:report.status,browser:report.browser,buildMs:report.identity?.buildMs,failure:report.failure,scenarios:report.scenarios})));
          }
          NODE
      - name: Tracked dependency inputs stay unchanged
        if: always()
        run: git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hhpi-browser-evidence-${{ github.sha }}
          path: .tmp/hhpi-browser/results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
