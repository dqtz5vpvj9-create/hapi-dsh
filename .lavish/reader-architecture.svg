<svg style="background:#fff;--bg:#fff;--surface:#f6f7f8;--fg:#22272c;--muted:#65717b;--border:#d8dedf;--soft:#edf7f1;--dangerbg:#fff1ef;--node:#fff;--warn:#976418" id="architecture-overview" viewBox="0 0 1330 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HAPI 与 hapi-dsh 五个架构阶段总图"><style>
:root{color-scheme:light;--bg:#fff;--surface:#f6f7f8;--fg:#22272c;--muted:#65717b;--border:#d8dedf;--accent:#359b6c;--soft:#edf7f1;--danger:#aa4141;--dangerbg:#fff1ef;--warn:#976418;--warnbg:#fff6e8;--node:#fff}
:root[data-theme=dark]{color-scheme:dark;--bg:#151a1e;--surface:#20272d;--fg:#e4e9ed;--muted:#a0b1bc;--border:#3b474f;--accent:#69c298;--soft:#20372c;--danger:#f1a19b;--dangerbg:#3e2828;--warn:#e7bb71;--warnbg:#3c3224;--node:#20272d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1440px;margin:0 auto;padding:36px 32px 64px}h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.25;letter-spacing:-.6px;margin:12px 0}h2{font-size:23px;line-height:1.35;margin:0 0 14px}h3{font-size:17px}header{padding-bottom:28px;border-bottom:1px solid var(--border)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent)}.lead{font-size:20px;max-width:1000px;margin:16px 0}.muted{color:var(--muted)}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.badge{font-size:12px;padding:3px 10px;border-radius:4px;background:var(--soft);color:var(--accent)}.bad{background:var(--warnbg);color:var(--warn)}.tools{float:right;display:flex;gap:10px}button,a{font:inherit}button{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}button[aria-selected=true]{border-color:var(--accent);background:var(--soft);color:var(--accent)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}section{margin-top:32px}.scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:24px 0}.scope p{font-size:14px;color:var(--muted)}.scope strong{display:block;color:var(--fg);margin-bottom:4px}.diagram-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:14px}.overview{min-width:1050px}.overview svg{width:100%;height:auto;display:block}.node{fill:var(--node);stroke:var(--border);stroke-width:1.2}.node-label{fill:var(--fg);font:600 14px system-ui,sans-serif}.node-sub{fill:var(--muted);font:11px system-ui,sans-serif}.edge{fill:none;stroke:var(--muted);stroke-width:1.4;color:var(--muted)}.lane-bg{fill:var(--surface)}.hapi .lane-bg,.v4 .lane-bg{fill:var(--soft)}.v0 .lane-bg{fill:var(--dangerbg)}.version-label{fill:var(--fg);font:700 16px system-ui,sans-serif}.version-subtitle{fill:var(--fg);font:600 14px system-ui,sans-serif}.lane-state{fill:var(--muted);font:12px system-ui,sans-serif}.col-label{fill:var(--muted);font:600 14px system-ui,sans-serif}.note-label{fill:var(--warn);font:600 15px system-ui,sans-serif}.note-sub{fill:var(--muted);font:13px system-ui,sans-serif}.caption{margin:10px 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.panel{min-width:0;border:1px solid var(--border);border-radius:9px;padding:20px}.panel.ref{background:var(--soft)}.portrait svg{display:block;max-height:610px;width:100%}.detail{padding:18px;background:var(--surface);border-radius:8px;margin-top:16px}.detail p+p{margin-top:10px}.detail strong{font-weight:600}.reference-links{font-size:12px;margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.callout{border-left:3px solid var(--warn);padding:16px 20px;background:var(--warnbg);margin-top:20px;border-radius:0 8px 8px 0}.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}details{min-width:0;border:1px solid var(--border);padding:12px 15px;border-radius:6px}summary{cursor:pointer;font-weight:600}details p{font-size:14px;color:var(--muted);margin-top:8px}code{font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}details code{display:block;margin-top:8px;color:var(--accent)}.small{font-size:13px}footer{border-top:1px solid var(--border);margin-top:30px;padding-top:18px;color:var(--muted);font-size:12px}
@media(max-width:720px){main{padding:22px 16px 40px}h1{font-size:27px}.lead{font-size:18px}.scope{grid-template-columns:1fr;gap:12px}.comparison{grid-template-columns:1fr}.source-grid{grid-template-columns:1fr}.tools{float:none;margin-bottom:16px}.panel{padding:16px}.portrait svg{max-height:none}.overview-note{display:block}.tabs button{padding:7px 9px;font-size:13px}}@media print{.tools,.tabs{display:none}.diagram-wrap{overflow:visible}.overview{min-width:0}main{padding:0}.source-grid{grid-template-columns:1fr}.comparison{break-inside:avoid}}
