"overview-hapi-3"><title>虚拟消息行 + 读取导航：WindowedMessageList / HappyThread</title><rect class="node" x="886" y="71" width="206" height="104" rx="8"/><text x="989" y="104" text-anchor="middle" class="node-label">虚拟消息行 + 读取导航</text><text x="989" y="131" text-anchor="middle" class="node-sub">WindowedMessageList</text><text x="989" y="149" text-anchor="middle" class="node-sub">HappyThread</text></g><path d="M1092 123 H1104" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-hapi-4"><title>NativeChatViewport：发布前采样；同一读者恢复</title><rect class="node" x="1108" y="71" width="206" height="104" rx="8"/><text x="1211" y="104" text-anchor="middle" class="node-label">NativeChatViewport</text><text x="1211" y="131" text-anchor="middle" class="node-sub">发布前采样</text><text x="1211" y="149" text-anchor="middle" class="node-sub">同一读者恢复</text></g></g><g id="overview-v0" class="lane v0"><title>V0 · 在 DSH 里重建远端会话</title><rect class="lane-bg" x="0" y="210" width="1330" height="142" rx="9"/><text x="16" y="244" class="version-label">V0</text><text x="16" y="270" class="version-subtitle">在 DSH 里重建远端会话</text><text x="16" y="320" class="lane-state">重构前</text><g id="overview-v0-0"><title>HAPI 原消息：message id / 源游标</title><rect class="node" x="220" y="229" width="206" height="104" rx="8"/><text x="323" y="262" text-anchor="middle" class="node-label">HAPI 原消息</text><text x="323" y="289" text-anchor="middle" class="node-sub">message id</text><text x="323" y="307" text-anchor="middle" class="node-sub">源游标</text></g><path d="M426 281 H438" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v0-1"><title>临时 Session + Projector：历史页进入会话运行时</title><rect class="node" x="442" y="229" width="206" height="104" rx="8"/><text x="545" y="262" text-anchor="middle" class="node-label">临时 Session + Projector</text><text x="545" y="289" text-anchor="middle" class="node-sub">历史页进入会话运行时</text></g><path d="M648 281 H660" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v0-2"><title>Host 映射 + SourceRecord：seq / turn / step；tail 与 target</title><rect class="node" x="664" y="229" width="206" height="104" rx="8"/><text x="767" y="262" text-anchor="middle" class="node-label">Host 映射 + SourceRecord</text><text x="767" y="289" text-anchor="middle" class="node-sub">seq / turn / step</text><text x="767" y="307" text-anchor="middle" class="node-sub">tail 与 target</text></g><path d="M870 281 H882" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v0-3"><title>Conversation 分组渲染：整轮过程、分组与消息</title><rect class="node" x="886" y="229" width="206" height="104" rx="8"/><text x="989" y="262" text-anchor="middle" class="node-label">Conversation 分组渲染</text><text x="989" y="289" text-anchor="middle" class="node-sub">整轮过程、分组与消息</text></g><path d="M1092 281 H1104" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v0-4"><title>官方读者 + 外部滚动补偿：多处决定提交与位置</title><rect class="node" x="1108" y="229" width="206" height="104" rx="8"/><text x="1211" y="262" text-anchor="middle" class="node-label">官方读者 + 外部滚动补偿</text><text x="1211" y="289" text-anchor="middle" class="node-sub">多处决定提交与位置</text></g></g><g id="overview-v1" class="lane v1"><title>V1 · 正文与执行分开</title><rect class="lane-bg" x="0" y="368" width="1330" height="142" rx="9"/><text x="16" y="402" class="version-label">V1</text><text x="16" y="428" class="version-subtitle">正文与执行分开</text><text x="16" y="478" class="lane-state">已落地</text><g id="overview-v1-0"><title>HAPI 原消息：message id / 源游标</title><rect class="node" x="220" y="387" width="206" height="104" rx="8"/><text x="323" y="420" text-anchor="middle" class="node-label">HAPI 原消息</text><text x="323" y="447" text-anchor="middle" class="node-sub">message id</text><text x="323" y="465" text-anchor="middle" class="node-sub">源游标</text></g><path d="M426 439 H438" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v1-1"><title>纯投影 → SourceFrame：HistoryProjectionSink；无临时 Session</title><rect class="node" x="442" y="387" width="206" height="104" rx="8"/><text x="545" y="420" text-anchor="middle" class="node-label">纯投影 → SourceFrame</text><text x="545" y="447" text-anchor="middle" class="node-sub">HistoryProjectionSink</text><text x="545" y="465" text-anchor="middle" class="node-sub">无临时 Session</text></g><path d="M648 439 H660" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v1-2"><title>独立正文流 + 单一源窗口：SourceFrameFeed → SourceWindowStore</title><rect class="node" x="664" y="387" width="206" height="104" rx="8"/><text x="767" y="420" text-anchor="middle" class="node-label">独立正文流 + 单一源窗口</text><text x="767" y="447" text-anchor="middle" class="node-sub">SourceFrameFeed →</text><text x="767" y="465" text-anchor="middle" class="node-sub">SourceWindowStore</text></g><path d="M870 439 H882" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v1-3"><title>官方 Conversation：客户端生成展示坐标</title><rect class="node" x="886" y="387" width="206" height="104" rx="8"/><text x="989" y="420" text-anchor="middle" class="node-label">官方 Conversation</text><text x="989" y="447" text-anchor="middle" class="node-sub">客户端生成展示坐标</text></g><path d="M1092 439 H1104" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v1-4"><title>官方读者 + 补偿适配：仍有分页/恢复的多入口</title><rect class="node" x="1108" y="387" width="206" height="104" rx="8"/><text x="1211" y="420" text-anchor="middle" class="node-label">官方读者 + 补偿适配</text><text x="1211" y="447" text-anchor="middle" class="node-sub">仍有分页/恢复的多入口</text></g></g><g id="overview-v2" class="lane v2"><title>V2 · 连续窗口与增量发布</title><rect class="lane-bg" x="0" y="526" width="1330" height="142" rx="9"/><text x="16" y="560" class="version-label">V2</text><text x="16" y="586" class="version-subtitle">连续窗口与增量发布</text><text x="16" y="636" class="lane-state">已落地</text><g id="overview-v2-0"><title>HAPI 原消息 / 页缓存：按源身份与游标复用</title><rect class="node" x="220" y="545" width="206" height="104" rx="8"/><text x="323" y="578" text-anchor="middle" class="node-label">HAPI 原消息 / 页缓存</text><text x="323" y="605" text-anchor="middle" class="node-sub">按源身份与游标复用</text></g><path d="M426 597 H438" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v2-1"><title>纯投影 → SourceFrame：消息身份不依赖页面局部序号</title><rect class="node" x="442" y="545" width="206" height="104" rx="8"/><text x="545" y="578" text-anchor="middle" class="node-label">纯投影 → SourceFrame</text><text x="545" y="605" text-anchor="middle" class="node-sub">消息身份不依赖页面局部序号</text></g><path d="M648 597 H660" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v2-2"><title>连续源窗口 → EventFeed：预算内保留；prepend / append / unchanged</title><rect class="node" x="664" y="545" width="206" height="104" rx="8"/><text x="767" y="578" text-anchor="middle" class="node-label">连续源窗口 → EventFeed</text><text x="767" y="605" text-anchor="middle" class="node-sub">预算内保留</text><text x="767" y="623" text-anchor="middle" class="node-sub">prepend / append / unchanged</text></g><path d="M870 597 H882" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v2-3"><title>官方 Conversation：修订/裁剪才需要 replace</title><rect class="node" x="886" y="545" width="206" height="104" rx="8"/><text x="989" y="578" text-anchor="middle" class="node-label">官方 Conversation</text><text x="989" y="605" text-anchor="middle" class="node-sub">修订/裁剪才需要 replace</text></g><path d="M1092 597 H1104" class="edge" marker-end="url(#overview-arrow)"/><g id="overview-v2-4"><title>恢复与正文版本分开：普通补页不再当作重连</title><rect class="node" x="1108" y="545" width="206" height="104" rx="8"/><text x="1211" y="578" text-anchor="middle" class="node-label">恢复与正文版本分开</text><text x="1211" y="605" text-anchor="middle" class="node-sub">普通补页不再当作重连</text></g></g><g id="overview-v3" class="lane v3"><title>V3 · 统一官方读者与虚拟行</title><rect class="lane-bg" x="0" y="684" width="1330" height="142" rx="9"/><text x="16" y="718" class="version-label">V3</text><text x="16" y="744" class="version-subtitle">统一官方读者与虚拟行</text><text x="16" y="794" class="lane-state">已落地，体验未过</text><g id="ove