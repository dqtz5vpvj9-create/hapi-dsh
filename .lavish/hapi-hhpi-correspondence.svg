<svg xmlns="http://www.w3.org/2000/svg" id="correspondence" viewBox="0 0 1280 1530" role="img" aria-labelledby="map-title map-desc" data-focus="all"><title id="map-title">HAPI 与当前 HHPI 核心阅读链路连线对照</title><desc id="map-desc">左边是本机 HAPI Native Codex 阅读路径，右边是 HHPI Codex 直连 DSH Web 路径。绿色虚线表示职责对应，不是跨系统调用。</desc><style>:root{--bg:#fff;--fg:#22272c;--muted:#65717b;--border:#d8dedf;--accent:#359b6c;--soft:#edf7f1;--warnbg:#fff6e8;--node:#fff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151a1e;--fg:#e4e9ed;--muted:#a0b1bc;--border:#3b474f;--accent:#69c298;--soft:#20372c;--warnbg:#3c3224;--node:#20272d}}:root[data-theme=dark]{--bg:#151a1e;--fg:#e4e9ed;--muted:#a0b1bc;--border:#3b474f;--accent:#69c298;--soft:#20372c;--warnbg:#3c3224;--node:#20272d}.sv-title{font:700 27px system-ui;fill:var(--fg)}.sv-number{font:600 16px system-ui;fill:var(--muted)}.sv-code{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--fg)}.sv-main{font:600 17px system-ui;fill:var(--fg)}.sv-sub{font:14px system-ui;fill:var(--muted)}.sv-label{font:600 13px system-ui;fill:var(--accent)}.sv-box{fill:var(--node);stroke:var(--border);stroke-width:1.4}.hhpi-box{fill:var(--soft);stroke:var(--accent);stroke-opacity:.55}.sv-map{fill:none;stroke:var(--accent);stroke-width:1.7;stroke-dasharray:7 5}.sv-flow{fill:none;stroke:var(--muted);stroke-width:1.3}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect width="1280" height="1530" fill="var(--bg)"/><text x="34" y="46" class="sv-title">HAPI</text><text x="748" y="46" class="sv-title">HHPI → DSH Web</text><text x="34" y="78" class="sv-sub">本机 Native Codex 主路径</text><text x="748" y="78" class="sv-sub">当前源码 · Codex 直接接入主路径</text><text x="598" y="61" text-anchor="middle" class="sv-sub">按职责连线</text><g id="map-source" class="mapping-row" data-map="source" tabindex="0"><title>① 来源与一次适配：适配格式不同</title><text x="34" y="127" class="sv-number">① 来源与一次适配</text><rect x="34" y="144" width="455" height="142" rx="9" class="sv-box"/><rect x="748" y="144" width="498" height="142" rx="9" class="sv-box hhpi-box"/><text x="53" y="181" class="sv-code">HAPI 原生接入 / 消息 API</text><text x="53" y="215" class="sv-main">输出 HAPI 消息记录</text><text x="53" y="249" class="sv-sub">消息仍需 normalizer、reducer 与展示投影</text><text x="768" y="181" class="sv-code">DirectCodexAdapter → CodexHistory</text><text x="768" y="215" class="sv-main">原生 item → DSH 兼容 SessionEvent</text><text x="768" y="249" class="sv-sub" style="font-size:16px">SourceEventIndex 保存稳定 seq / turn / step</text><path id="map-edge-source" d="M489 214 C565 214 666 214 748 214" class="sv-map"><title>适配格式不同，表示职责对应</title></path><rect x="513" y="193" width="210" height="42" rx="21" fill="var(--bg)"/><text x="618" y="219" text-anchor="middle" class="sv-label">适配格式不同</text><path d="M263 286 V318" class="sv-flow" marker-end="url(#arr)"/><path d="M997 286 V318" class="sv-flow" marker-end="url(#arr)"/></g><g id="map-cache" class="mapping-row" data-map="cache" tabindex="0"><title>② 共享条目与读取缓存：缓存相似，窗口归属不同</title><text x="34" y="345" class="sv-number">② 共享条目与读取缓存</text><rect x="34" y="362" width="455" height="142" rx="9" class="sv-box"/><rect x="748" y="362" width="498" height="142" rx="9" class="sv-box hhpi-box"/><text x="53" y="399" class="sv-code">HistoryPageRepository</text><text x="53" y="433" class="sv-main">message-window-store</text><text x="53" y="467" class="sv-sub">按 sessionId 保存消息窗口、游标、请求状态</text><text x="768" y="399" class="sv-code">RemoteSourceHistory</text><text x="768" y="433" class="sv-main">共享条目 / 页缓存 / epoch / version</text><text x="768" y="467" class="sv-sub">RemoteHistoryWindow 为每个 view 保存独立区间</text><path id="map-edge-cache" d="M489 432 C565 432 666 432 748 432" class="sv-map"><title>缓存相似，窗口归属不同，表示职责对应</title></path><rect x="513" y="411" width="210" height="42" rx="21" fill="var(--bg)"/><text x="618" y="437" text-anchor="middle" class="sv-label">缓存相似，窗口归属不同</text><path d="M263 504 V536" class="sv-flow" marker-end="url(#arr)"/><path d="M997 504 V536" class="sv-flow" marker-end="url(#arr)"/></g><g id="map-projection" class="mapping-row" data-map="projection" tabindex="0"><title>③ 浏览器展示投影：两边仍需展示投影</title><text x="34" y="563" class="sv-number">③ 浏览器展示投影</text><rect x="34" y="580" width="455" height="142" rx="9" class="sv-box"/><rect x="748" y="580" width="498" height="142" rx="9" class="sv-box hhpi-box"/><text x="53" y="617" class="sv-code">normalizer → reducer</text><text x="53" y="651" class="sv-main">NativeChatProjection</text><text x="53" y="685" class="sv-sub">从 HAPI 消息构建 block / node，并保留稳定引用</text><text x="768" y="617" class="sv-code">BoundHistoryView</text><text x="768" y="651" class="sv-main">ConversationNodeAssembler</text><text x="768" y="685" class="sv-sub" style="font-size:16px">官方 historyRead 接口接入；每个 Pane 独立 assembler</text><path id="map-edge-projection" d="M489 650 C565 650 666 650 748 650" class="sv-map"><title>两边仍需展示投影，表示职责对应</title></path><rect x="513" y="629" width="210" height="42" rx="21" fill="var(--bg)"/><text x="618" y="655" text-anchor="middle" class="sv-label">两边仍需展示投影</text><path d="M263 722 V754" class="sv-flow" marker-end="url(#arr)"/><path d="M997 722 V754" class="sv-flow" marker-end="url(#arr)"/></g><g id="map-virtual" class="mapping-row" data-map="virtual" tabindex="0"><title>④ 虚拟行与正文组件：相同职责，不同组件</title><text x="34" y="781" class="sv-number">④ 虚拟行与正文组件</text><rect x="34" y="798" width="455" height="142" rx="9" class="sv-box"/><rect x="748" y="798" width="498" height="142" rx="9" class="sv-box hhpi-box"/><text x="53" y="835" class="sv-code">WindowedMessageList</text><text x="53" y="869" class="sv-main">NativeCodexThread / NativeSeat</text><text x="53" y="903" class="sv-sub">按 message / block 身份挂载可见行</text><text x="768" y="835" class="sv-code">官方 Conversation / Chat</text><text x="768" y="869" class="sv-main">VirtualChatRows</text><text x="768" y="903" class="sv-sub">HHPI 复用 DSH 正文、编辑器与插件 slot</text><path id="map-edge-virtual" d="M489 868 C565 868 666 868 748 868" class="sv-map"><title>相同职责，不同组件，表示职责对应</title></path><rect x="513" y="847" width="210" height="42" rx="21" fill="var(--bg)"/><text x="618" y="873" text-anchor="middle" class="sv-label">相同职责，不同组件</text><path d="M263 940 V972" class="sv-flow" marker-end="url(#arr)"/><path d="M997 940 V972" class="sv-flow" marker-end="url(#arr)"/></g><g id="map-reader" class="mapping-row" data-map="reader" tabindex="0"><title>⑤ 自动与手动翻页：同一读者接管窗口</title><text x="34" y="999" class="sv-number">⑤ 自动与手动翻页</text><rect x="34" y="1016" width="455" height="142" rx="9" class="sv-box"/><rect x="748" y="1016" width="498" height="142" rx="9" class="sv-box hhpi-box"/><text x="53" y="1053" class="sv-code">NativeCodexThread + useChatScroll</text><text x="53" y="1087" class="sv-main">消息窗口的 loadMore / context / latest</text><text x="53" y="1121" class="sv-sub">HAPI 自己的阅读导航与数据窗口对接</text><text x="768" y="1053" class="sv-code">ChatNavigation → RemotePaneSession</text><text x="768" y="1087" class="sv-main" style="font-size:16px">BoundHistoryView.read(before / after / latest)</text><text x="768" y="1121" class="sv-sub">自动边界与按钮进入同一个官方读者</text><path id="map-edge-reader" d="M489 1086 C565 1086 666 1086 748 1086" class="sv-map"><title>同一读者接管窗口，表示职责对应</title></path><rect x="513" y="1065" width="210" height="42" rx="21" fill="var(--bg)"/><text x="618" y="1091" text-anchor="middle" class="sv-label">同一读者接管窗口</text><path d="M263 1158 V1190" class="sv-flow" marker-end="url(#arr)"/><path d="M997 1158 V1190" class="sv-flow" marker-end="url(#arr)"/></g><g id="map-commit" class="mapping-row" data-map="commit" tabindex="0"><title>⑥ 提交与位置恢复：提交原则对应，代码入口不同</title><text x="34" y="1217" class="sv-number">⑥ 提交与位置恢复</text><rect x="34" y="1234" width="455" height="142" rx="9" class="sv-box"/><rect x="748" y="1234" width="498" height="142" rx="9" class="sv-box hhpi-box"/><text x="53" y="1271" class="sv-code">NativePageCommit</text><text x="53" y="1305" class="sv-main">NativeChatViewport</text><text x="53" y="1339" class="sv-sub">React 修改 DOM 前采样，布局后恢复锚点</text><text x="768" y="1271" class="sv-code">windowCommit 协调器 + ChatViewport</text><text x="768" y="1305" class="sv-main">准备候选 → 采样 → 发布 → 布局恢复</text><text x="768" y="1339" class="sv-sub" style="font-size:16px">官方 readingView 与 mounted Chat 参与同一次提交</text><path id="map-edge-commit" d="M489 1304 C565 1304 666 1304 748 1304" class="sv-map"><title>提交原则对应，代码入口不同，表示职责对应</title></path><rect x="513" y="1283" width="210" height="42" rx="21" fill="var(--bg)"/><text x="618" y="1309" text-anchor="middle" class="sv-label">提交原则对应，代码入口不同</text></g><rect x="34" y="1437" width="1212" height="64" rx="8" fill="var(--warnbg)"/><text x="54" y="1464" class="sv-main">相同的阅读原则 ≠ 相同的数据模型，也不直接证明体验相同。</text><text x="54" y="1488" class="sv-sub">HHPI 仍有接入事件模型、共享缓存、Pane 外观和官方 assembler；消除的是跨运行时的反复转换。</text></svg>