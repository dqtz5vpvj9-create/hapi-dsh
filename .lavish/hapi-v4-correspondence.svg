<svg xmlns="http://www.w3.org/2000/svg" id="hapi-v4-correspondence-svg" class="correspondence-svg" viewBox="0 0 1280 1200" role="img" aria-labelledby="corr-title corr-desc" data-focus="all"><title id="corr-title">HAPI 与 V4 聊天阅读架构的职责连线对照</title><desc id="corr-desc">上方实线展示两套系统各自的正文流。下方虚线把消息窗口、展示投影、虚拟行、导航读者和位置恢复五组职责逐一对应。HAPI 消息窗口对应 V4 三个模块，投影对应 V4 额外源帧与事件转换；完整 historySource 与 windowCommit 尚未接入 V4 主路径。</desc><defs><marker id="corr-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><style>
:root{--bg:#fff;--fg:#22272c;--muted:#65717b;--border:#d8dedf;--accent:#359b6c;--soft:#edf7f1;--warn:#976418;--warnbg:#fff6e8;--node:#fff;--surface:#f6f7f8}
@media(prefers-color-scheme:dark){:root{--bg:#151a1e;--fg:#e4e9ed;--muted:#a0b1bc;--border:#3b474f;--accent:#69c298;--soft:#20372c;--warn:#e7bb71;--warnbg:#3c3224;--node:#20272d;--surface:#20272d}}
:root[data-theme=light]{--bg:#fff;--fg:#22272c;--muted:#65717b;--border:#d8dedf;--accent:#359b6c;--soft:#edf7f1;--warn:#976418;--warnbg:#fff6e8;--node:#fff;--surface:#f6f7f8}
:root[data-theme=dark]{--bg:#151a1e;--fg:#e4e9ed;--muted:#a0b1bc;--border:#3b474f;--accent:#69c298;--soft:#20372c;--warn:#e7bb71;--warnbg:#3c3224;--node:#20272d;--surface:#20272d}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--fg)}.s-title{font-size:27px;font-weight:700}.s-sub{font-size:15px;fill:var(--muted)}.s-col{font-size:20px;font-weight:700}.s-heading{font-size:19px;font-weight:650}.s-code{font-size:17px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.s-small{font-size:14px;fill:var(--muted)}.s-caption{font-size:15px;fill:var(--muted)}.s-label{font-size:15px;font-weight:600;fill:var(--accent)}.s-orange{fill:var(--warn)}.s-box{fill:var(--node);stroke:var(--border);stroke-width:1.3}.s-extra{fill:var(--warnbg);stroke:var(--warn);stroke-width:1.3}.s-flow{fill:none;stroke:var(--muted);stroke-width:1.6}.s-map{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 5}.s-map-extra{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 5}
</style><rect width="1280" height="1200" fill="var(--bg)"/><text x="40" y="47" class="s-title">HAPI ↔ V4：哪些职责已对应，哪些层仍然多出来</text><text x="40" y="78" class="s-sub">实线只表示各自正文流；虚线只表示职责对应。下方按职责排列，不是调用顺序。</text><g id="corr-hapi-flow"><title>HAPI 正文处理顺序</title><rect x="40" y="114" width="1200" height="50" rx="8" fill="var(--soft)"/><text x="58" y="145" class="s-heading">HAPI</text><text x="225.0" y="145" class="s-label" text-anchor="middle">原消息</text><path d="M316 139 H337" class="s-flow" marker-end="url(#corr-flow-arrow)"/><text x="456.0" y="145" class="s-label" text-anchor="middle">原始消息窗口</text><path d="M572 139 H593" class="s-flow" marker-end="url(#corr-flow-arrow)"/><text x="719.5" y="145" class="s-label" text-anchor="middle">引用窗口的投影</text><path d="M843 139 H864" class="s-flow" marker-end="url(#corr-flow-arrow)"/><text x="1043.0" y="145" class="s-label" text-anchor="middle">虚拟消息 / 块行</text></g><g id="corr-v4-flow"><title>V4 正文处理顺序</title><rect x="40" y="181" width="1200" height="50" rx="8" fill="var(--soft)"/><text x="58" y="212" class="s-heading">V4</text><text x="210.0" y="212" class="s-label" text-anchor="middle">原消息</text><path d="M286 206 H307" class="s-flow" marker-end="url(#corr-flow-arrow)"/><rect x="316" y="188" width="202" height="36" rx="6" fill="var(--warnbg)"/><text x="417.0" y="212" class="s-label s-orange" text-anchor="middle">Host 源帧</text><path d="M524 206 H545" class="s-flow" marker-end="url(#corr-flow-arrow)"/><rect x="554" y="188" width="226" height="36" rx="6" fill="var(--warnbg)"/><text x="667.0" y="212" class="s-label s-orange" text-anchor="middle">源窗口 / DSH 坐标</text><path d="M786 206 H807" class="s-flow" marker-end="url(#corr-flow-arrow)"/><text x="904.0" y="212" class="s-label" text-anchor="middle">Chat Node</text><path d="M998 206 H1019" class="s-flow" marker-end="url(#corr-flow-arrow)"/><text x="1120.5" y="212" class="s-label" text-anchor="middle">独立虚拟行</text></g><text x="40" y="277" class="s-col">HAPI · 本机 Native Codex 主路径</text><text x="760" y="277" class="s-col">V4 · 当前 ext.18</text><text x="607" y="277" class="s-small" text-anchor="middle">职责对应</text><g id="corr-window" class="mapping-row" data-map="window"><title>消息窗口：HAPI 一个主要窗口模块，对应 V4 请求、缓存和源窗口三个模块</title><g id="corr-hapi-window"><title>HAPI 原始消息窗口</title><rect x="40" y="301" width="414" height="146" rx="8" class="s-box"/></g><text x="62" y="334" class="s-heading">① 原始消息窗口</text><text x="62" y="369" class="s-code">message-window-store</text><text x="62" y="399" class="s-small">原消息 + 游标 + 合并 / 裁剪</text><text x="62" y="427" class="s-small">窗口与请求状态围绕同一原消息集合</text><g id="corr-v4-SourceRecord"><title>SourceRecord：请求 / 源游标</title><rect x="760" y="301" width="480" height="42" rx="8" class="s-box"/></g><text x="778" y="328" class="s-code">SourceRecord</text><text x="1219" y="328" class="s-small" text-anchor="end">请求 / 源游标</text><g id="corr-v4-SourceHistoryPageCache"><title>SourceHistoryPageCache：历史页复用</title><rect x="760" y="353" width="480" height="42" rx="8" class="s-box"/></g><text x="778" y="380" class="s-code">SourceHistoryPageCache</text><text x="1219" y="380" class="s-small" text-anchor="end">历史页复用</text><g id="corr-v4-SourceWindowStore"><title>SourceWindowStore：连续源帧 + DSH 坐标</title><rect x="760" y="405" width="480" height="42" rx="8" class="s-extra"/></g><text x="778" y="432" class="s-code s-orange">SourceWindowStore</text><text x="1219" y="432" class="s-small s-orange" text-anchor="end">连续源帧 + DSH 坐标</text><path id="corr-window-map-0" d="M454 374 C560 374 650 322 760 322" class="s-map"><title>corr-window-map-0：职责对应，不是跨系统调用</title></path><path id="corr-window-map-1" d="M454 374 C560 374 650 374 760 374" class="s-map"><title>corr-window-map-1：职责对应，不是跨系统调用</title></path><path id="corr-window-map-2" d="M454 374 C560 374 650 426 760 426" class="s-map-extra"><title>corr-window-map-2：职责对应，不是跨系统调用</title></path><rect x="492" y="357" width="228" height="29" rx="14" fill="var(--bg)"/><text x="606.0" y="377" class="s-label" text-anchor="middle">窗口职责分在 3 个模块</text></g><g id="corr-projection" class="mapping-row" data-map="projection"><title>展示投影：V4 多出 Host 源帧投影和客户端事件组装；坐标转换还涉及 SourceWindowStore</title><g id="corr-hapi-projection"><title>HAPI NativeChatProjection 引用原始消息窗口</title><rect x="40" y="480" width="414" height="160" rx="8" class="s-box"/></g><text x="62" y="514" class="s-heading">② 展示投影</text><text x="62" y="550" class="s-code">NativeChatProjection</text><text x="62" y="581" class="s-small">引用原窗口，生成显示节点与分组</text><text x="62" y="612" class="s-small">也有别名和映射，但不重建执行会话</text><g id="corr-v4-host-projection"><title>Host 纯投影：HAPI 消息转为 SourceFrame 并通过独立正文流发送</title><rect x="760" y="480" width="480" height="70" rx="8" class="s-extra"/></g><text x="778" y="508" class="s-code s-orange">Host 纯投影 → SourceFrame</text><text x="778" y="533" class="s-small">HistoryProjectionSink / SourceFrameFeed</text><g id="corr-v4-assembler"><title>客户端 SourceEventFeed 与 Conversation assembler 转为 Chat Node</title><rect x="760" y="568" width="480" height="72" rx="8" class="s-extra"/></g><text x="778" y="596" class="s-code s-orange">SourceEventFeed → Conversation</text><text x="778" y="622" class="s-small">组装 DSH 生命周期事件 → Chat Node</text><path id="corr-projection-host-map" d="M454 559 C565 559 650 515 760 515" class="s-map-extra"><title>corr-projection-host-map：职责对应，不是跨系统调用</title></path><path id="corr-projection-node-map" d="M454 559 C565 559 650 604 760 604" class="s-map-extra"><title>corr-projection-node-map：职责对应，不是跨系统调用</title></path><rect x="482" y="543" width="247" height="29" rx="14" fill="var(--bg)"/><text x="605.5" y="563" class="s-label s-orange" text-anchor="middle">投影被拆成跨 Host / 客户端</text></g><g id="corr-virtual" class="mapping-row" data-map="virtual"><title>③ 虚拟行：都是 DOM 虚拟窗口</title><g id="corr-hapi-virtual"><title>③ 虚拟行 HAPI</title><rect x="40" y="668" width="414" height="92" rx="8" class="s-box"/></g><text x="62" y="696" class="s-heading">③ 虚拟行</text><text x="62" y="724" class="s-code">WindowedMessageList</text><text x="62" y="748" class="s-small">按 message / block 稳定身份挂载</text><g id="corr-v4-virtual"><title>③ 虚拟行 V4</title><rect x="760" y="668" width="480" height="92" rx="8" class="s-box"/></g><text x="778" y="703" class="s-code">VirtualChatRows</text><text x="778" y="732" class="s-small">按完整 Chat Node 顺序挂载；不等过程分组</text><path id="corr-virtual-map" d="M454 714.0 H760" class="s-map"><title>corr-virtual-map：职责对应，不是跨系统调用</title></path><rect x="487" y="699.0" width="242" height="29" rx="14" fill="var(--bg)"/><text x="608.0" y="719.0" class="s-label" text-anchor="middle">都是 DOM 虚拟窗口</text></g><g id="corr-reader" class="mapping-row" data-map="reader"><title>④ 导航与读者：复用相同策略体系</title><g id="corr-hapi-reader"><title>④ 导航与读者 HAPI</title><rect x="40" y="790" width="414" height="106" rx="8" class="s-box"/></g><text x="62" y="818" class="s-heading">④ 导航与读者</text><text x="62" y="846" class="s-code">NativeCodexThread + useChatScroll</text><text x="62" y="870" class="s-small">复用 Reading / Navigation 策略</text><g id="corr-v4-reader"><title>④ 导航与读者 V4</title><rect x="760" y="790" width="480" height="106" rx="8" class="s-box"/></g><text x="778" y="825" class="s-code">mounted Chat + ChatNavigation</text><text x="778" y="854" class="s-small">自动与按钮共用 loadEarlier；Pane 绑定各自读者</text><text x="778" y="879" class="s-small s-orange">共享源窗口仍由 SourceSessions.records 管理</text><path id="corr-reader-map" d="M454 843.0 H760" class="s-map"><title>corr-reader-map：职责对应，不是跨系统调用</title></path><rect x="487" y="828.0" width="242" height="29" rx="14" fill="var(--bg)"/><text x="608.0" y="848.0" class="s-label" text-anchor="middle">复用相同策略体系</text></g><g id="corr-commit" class="mapping-row" data-map="commit"><title>⑤ 提交与位置恢复：恢复职责已对应</title><g id="corr-hapi-commit"><title>⑤ 提交与位置恢复 HAPI</title><rect x="40" y="926" width="414" height="112" rx="8" class="s-box"/></g><text x="62" y="954" class="s-heading">⑤ 提交与位置恢复</text><text x="62" y="982" class="s-code">NativePageCommit</text><text x="62" y="1006" class="s-small">NativeChatViewport：提交前采样 / 布局后恢复</text><g id="corr-v4-commit"><title>⑤ 提交与位置恢复 V4</title><rect x="760" y="926" width="480" height="112" rx="8" class="s-box"/></g><text x="778" y="961" class="s-code">preparePageCommit + ChatViewport</text><text x="778" y="990" class="s-small">同一 mounted reader 采样与恢复已接入</text><text x="778" y="1017" class="s-small s-orange">这不等于完整 historySource / windowCommit 接入</text><path id="corr-commit-map" d="M454 982.0 H760" class="s-map"><title>corr-commit-map：职责对应，不是跨系统调用</title></path><rect x="487" y="967.0" width="242" height="29" rx="14" fill="var(--bg)"/><text x="608.0" y="987.0" class="s-label" text-anchor="middle">恢复职责已对应</text></g><g id="corr-incomplete-commit"><title>缺口：完整 historySource 和 windowCommit 尚未接入 SourceSessions 的主路径</title><path d="M1000 1038 V1061" class="s-map-extra"/><rect x="40" y="1063" width="1200" height="88" rx="8" fill="var(--warnbg)" stroke="var(--warn)" stroke-dasharray="7 5"/><text x="61" y="1095" class="s-heading s-orange">尚未接通：完整 historySource / windowCommit → SourceSessions 主路径</text><text x="61" y="1126" class="s-caption">普通 prepend 已统一读者；完整窗口替换、独立窗口与原子提交仍不能画成已经等同 HAPI。</text></g><text x="40" y="1181" class="s-small">按源码职责连线，非类的一一替换；不表示连续阅读验收通过。HAPI 指本机当前源码。</text></svg>