<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发进度与效率</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--fg:#25272a;--muted:#68716d;--accent:#3f655c;--line:#dee5e1;--soft:#eaf0ed;--warn:#9c641f;--bad:#b83e3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:30px 24px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.6px;margin:3px 0}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0}p{margin:8px 0}.muted,small{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--accent);font-size:12px}.bad{color:var(--bad)}.warning{color:var(--warn)}button,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}.card strong{display:block;font-size:29px;font-weight:600;line-height:1.25;margin:8px 0}.card small{font-size:12px}.bar{height:5px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:15px}.bar i{height:100%;display:block;background:var(--accent)}nav{display:flex;gap:20px;margin:28px 0 20px;border-bottom:1px solid var(--line)}nav button{border:0;border-radius:0;background:transparent;padding:11px 2px;color:var(--muted)}nav button[aria-selected=true]{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:600}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}.stack{display:grid;gap:18px}.stack>*,.columns>*{min-width:0}section{margin-bottom:18px}section>header{margin-bottom:10px}section>header h2{margin:0}.task{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.dot{width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--muted)}.dot.running,.dot.done{background:var(--accent)}.dot.blocked{background:var(--warn)}.task small{display:block}.timeline-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 54px;gap:12px;align-items:center;font-size:12px;margin:12px 0}.timeline-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{position:relative;height:14px;background:var(--soft);border-radius:3px}.track i{position:absolute;height:100%;min-width:2px;background:var(--accent);border-radius:3px}.track i.running{background:var(--warn)}.track i.failed,.track i.timed-out{background:var(--bad)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:500;color:var(--muted)}td,th,p,summary,code,strong,b{overflow-wrap:anywhere}#work-attribution article{padding:0 0 15px;margin:0 0 15px;border-bottom:1px solid var(--line)}#work-attribution article p{margin:7px 0;font-size:14px}#work-attribution article details{font-size:12px;color:var(--muted)}#work-attribution td:last-child{white-space:nowrap;width:80px}.empty{padding:25px 0;color:var(--muted)}svg{display:block;max-width:100%;width:100%;height:auto}svg text{fill:var(--fg);font-family:inherit}svg .box{fill:var(--surface);stroke:var(--line)}svg .edge{stroke:var(--line);fill:none;stroke-width:1.5}svg .node{cursor:pointer}svg .node:hover .box{stroke:var(--accent);stroke-width:2}svg .running .box,svg .done .box{fill:var(--soft);stroke:var(--accent)}.scroll{overflow:auto;max-width:100%}.graph>svg{min-width:760px}.hint{padding:12px 14px;background:var(--soft);border-radius:8px;font-size:13px}.hidden{display:none!important}.lineage{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}.lineage article{padding-bottom:22px;position:relative}.lineage article:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;left:-23px;top:8px}.ratio{display:grid;grid-template-columns:100px minmax(0,1fr) 50px;gap:12px;align-items:center;margin:9px 0;font-size:12px}.ratio .bar{margin:0}.pipeline-mobile{display:none}.readiness{font-size:13px;color:var(--muted)}footer{font-size:12px;color:var(--muted);margin-top:22px}[data-theme=dark]{color-scheme:dark;--bg:#1b1d1e;--surface:#222625;--fg:#f1f3f1;--muted:#a2aaa5;--accent:#9ab9ad;--line:#39433e;--soft:#2d3933;--warn:#dfb577;--bad:#f09898}@media(max-width:700px){.pipeline-desktop{display:none}.pipeline-mobile{display:block}main{padding:18px 14px 40px}header{align-items:flex-start;flex-direction:column}h1{font-size:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,section{padding:15px}.card strong{font-size:25px}.columns{grid-template-columns:minmax(0,1fr)}nav{gap:17px;font-size:13px}.timeline-row{grid-template-columns:minmax(0,1fr) minmax(0,.9fr) 42px;gap:8px}td,th{padding:8px 5px;font-size:12px}}
</style></head><body><main>
<header><div><div class="eyebrow">HHPI · HARNESS ENGINEERING</div><h1>开发进度与效率</h1><div class="muted" id="subtitle"></div></div><div class="top-actions"><span class="badge" id="freshness">读取记录</span><button id="theme" aria-label="切换明暗主题">明 / 暗</button></div></header>
<section><h2>当前工作</h2><div id="current-work"></div><div id="scope-changes"></div></section>
<div class="columns"><section><h2>具体阻塞</h2><div id="current-blockers"></div></section><section><h2>待上线</h2><div id="pending-release"></div></section></div>
<section><h2>最新结果</h2><div id="recent-results"></div></section>
<details><summary>开发任务统计</summary><div class="cards" id="metrics"></div></details>
<nav role="tablist"><button role="tab" aria-selected="true" data-tab="execution">当前开发</button><button role="tab" aria-selected="false" data-tab="rsi">历史 RSI 记录</button><button role="tab" aria-selected="false" data-tab="plan">任务 DAG</button></nav>
<div id="execution" role="tabpanel"><details><summary>历史耗时归因</summary><section id="work-attribution"></section></details><details><summary>时间戳覆盖与采集详情</summary><div class="columns"><section><header><h2>日志覆盖范围</h2><span class="badge" id="run-state"></span></header><div id="timing"></div><p class="readiness">记录区间按并集计时，不能当作模型计算或实际开发工时。</p></section><section><h2>Agent 时间线</h2><div id="timeline"></div></section></div></details><details><summary>任务状态与交付证据</summary><div class="columns"><section><h2>任务状态</h2><div id="tasks"></div></section><section><h2>交付证据</h2><div id="coverage"></div></section></div></details></div>
<div id="rsi" role="tabpanel" class="hidden"><section><header><h2>RSI 对照实验已取消 · 保留历史结果</h2><span class="badge" id="active-policy"></span></header><p class="readiness">以下仅为历史实验记录；不再发起父版本/候选对照，不再把 RSI 实验列为产品交付条件。</p></section><div class="columns"><section><h2>候选与对照进度</h2><div id="evaluations"></div></section><section><h2>策略谱系与采用记录</h2><div id="policies" class="lineage"></div><div id="promotions"></div></section></div></div>
<div id="plan" role="tabpanel" class="hidden"><section><header><h2 id="dag-title">任务依赖</h2><label>范围 <select id="dag-source"><option value="current">当前 run</option><option value="planned">HHPI 产品计划</option></select></label></header><p id="dag-note" class="readiness"></p><div id="graph" class="scroll graph"></div><div id="node-detail" class="hint">选择一个节点查看依赖与状态。</div></section></div>
<footer id="timestamp"></footer><footer>只读开发看板 · 保留原始计划、取消依据和各层验收记录。</footer>
</main><script>
let snapshot=/*__INITIAL__*/;const feed=/*__FEED__*/;
const $=id=>document.getElementById(id),e=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={running:'进行中',working:'进行中',waiting:'待验收',ready:'待领取',pending:'等依赖',blocked:'已阻塞',done:'已完成',completed:'已完成',incomplete:'未完成',cancelled:'已取消','pending-release':'待上线',released:'已上线',passed:'通过',failed:'失败',unknown:'未验证',observed:'已观测','not-run':'未执行','timed-out':'超时'};
const label=s=>labels[s]||s,seconds=ms=>ms<60000?(ms/1000).toFixed(1)+'s':(ms/60000).toFixed(1)+'m';
function renderCurrent(r){
const latest=new Map();for(const s of r?.spans||[]){if(s.kind!=='progress')continue;const [title,...parts]=s.label.split(' · ');latest.set(title,{title,summary:parts.join(' · '),status:s.status,node:s.node,agent:s.agent,at:s.started})}for(const p of r?.progress||[]){if(!latest.has(p.title)||latest.get(p.title).at<=p.at)latest.set(p.title,p)}
const progress=[...latest.values()].sort((a,b)=>b.at-a.at),tasks=r?.tasks||[],nodes=r?.nodes||[],title=id=>nodes.find(n=>n.id===id)?.title||id;
const row=p=>`<div class="task"><span class="dot ${e(p.status)}"></span><div><b>${e(p.title)}</b><small>${e(p.summary)}</small>${p.evidence?`<details><summary>依据</summary><small>${e(p.evidence)}</small></details>`:''}</div><span class="badge">${e(label(p.status))}</span></div>`;
const working=progress.filter(p=>p.status==='working');for(const t of tasks.filter(t=>t.state==='running'&&!working.some(p=>p.node===t.node)))working.push({title:t.node+' · '+title(t.node),summary:t.reason||t.agent,status:'working'});
$('current-work').innerHTML=working.map(row).join('')||'<p class="empty">当前没有进行中的执行记录。</p>';
const blockers=tasks.filter(t=>t.state==='blocked').map(t=>({title:t.node+' · '+title(t.node),summary:t.reason||'尚未记录阻塞原因',status:'blocked'}));for(const p of progress.filter(p=>p.status==='blocked'&&!tasks.some(t=>t.node===p.node&&t.state==='blocked')))blockers.push(p);
$('current-blockers').innerHTML=blockers.map(row).join('')||'<p class="empty">没有已记录的阻塞。</p>';
$('pending-release').innerHTML=progress.filter(p=>p.status==='pending-release').map(row).join('')||'<p class="empty">没有已记录的待上线项。</p>';
$('scope-changes').innerHTML=tasks.filter(t=>t.state==='cancelled').map(t=>`<p class="hint">${e(t.node+' · '+title(t.node))}：已取消。${e(t.reason)}</p>`).join('');
const results=progress.filter(p=>['completed','released'].includes(p.status)).map(row);for(const c of [...(r?.coverage||[])].filter(c=>c.created).sort((a,b)=>b.created-a.created).slice(0,5))results.push(row({title:c.requirement,summary:c.layer+' · '+(c.evidence||'尚未记录依据'),status:c.status}));$('recent-results').innerHTML=results.slice(0,8).join('')||'<p class="empty">暂无结果记录。</p>';
}
function graph(){const planned=$('dag-source').value==='planned',nodes=planned?snapshot.plan?.nodes:snapshot.run?.nodes;const tasks=planned?[]:snapshot.run?.tasks||[];$('dag-note').textContent=planned?'规划视图：这些节点尚未关联本次 run；不能把基础设施进度当作产品实施进度。':'节点状态来自当前执行记录；依赖满足和文件互斥分别决定是否可领取。';if(!nodes?.length){$('graph').innerHTML='<p class="empty">暂无任务图。</p>';return}const map=new Map(nodes.map(n=>[n.id,n])),depth=new Map(),levels=[];function level(id){if(depth.has(id))return depth.get(id);const n=map.get(id);const value=1+Math.max(-1,...(n?.depends_on||[]).filter(d=>map.has(d)).map(level));depth.set(id,value);return value}nodes.forEach(n=>{const l=level(n.id);(levels[l]||=[]).push(n)});const pos=new Map();levels.forEach((group,x)=>group.forEach((n,y)=>pos.set(n.id,{x:x*165+8,y:y*74+8})));const height=Math.max(1,...levels.map(a=>a.length))*74+16,width=levels.length*165+16;let svg=`<svg viewBox="0 0 ${width} ${height}" style="min-width:${Math.max(760,width)}px" role="img" aria-label="任务依赖图">`;for(const n of nodes){const b=pos.get(n.id);for(const d of n.depends_on||[]){const a=pos.get(d);if(a)svg+=`<path class="edge" d="M${a.x+135} ${a.y+25} C${a.x+153} ${a.y+25},${b.x-18} ${b.y+25},${b.x} ${b.y+25}"/>`}}for(const n of nodes){const p=pos.get(n.id),state=tasks.find(t=>t.node===n.id)?.state||'planned';svg+=`<g class="node ${e(state)}" data-node="${e(n.id)}" tabindex="0" role="button" aria-label="${e(n.id+' '+n.title)}"><title>${e(n.title)}</title><rect class="box" x="${p.x}" y="${p.y}" width="135" height="52" rx="8"/><text x="${p.x+12}" y="${p.y+22}" font-size="13">${e(n.id)}</text><text x="${p.x+12}" y="${p.y+40}" font-size="10">${e(planned?n.group||'计划中':label(state))}</text></g>`}svg+='</svg>';$('graph').innerHTML=svg;$('graph').querySelectorAll('[data-node]').forEach(el=>{const show=()=>{const n=map.get(el.dataset.node);$('node-detail').textContent=n.id+' · '+n.title+'；原始前置：'+((n.depends_on||[]).join('、')||'无')+'；已取消的前置不再阻塞当前执行'};el.onclick=show;el.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();show()}}})}
function render(){const expanded=[...document.querySelectorAll('details')].map(d=>d.open);const r=snapshot.run,tasks=r?.tasks||[],cancelled=tasks.filter(t=>t.state==='cancelled'),coverage=(r?.coverage||[]).map(c=>({...c,cancelled:c.cancelled||cancelled.some(t=>t.node===c.node)})),activeCoverage=coverage.filter(c=>!c.cancelled),passed=activeCoverage.filter(c=>c.status==='passed').length,done=tasks.filter(t=>t.state==='done').length,pending=activeCoverage.filter(c=>c.status!=='passed').length;renderCurrent(r);
const phaseName=({paused:'产品开发暂停',discussion:'产品开发暂停 · 讨论 / harness 维护',development:'产品开发阶段'})[r?.activity?.phases?.at(-1)?.state];$('subtitle').textContent=r?r.id+' · '+(phaseName||label(r.status)):'等待第一份开发记录';$('metrics').innerHTML=[['开发任务记录',done+' 完成 / '+(tasks.length-cancelled.length)+' 有效',cancelled.length+' 已取消 · 原始计划 '+tasks.length+' 项',tasks.length>cancelled.length?done/(tasks.length-cancelled.length):0],['行为证据',passed+' / '+activeCoverage.length,pending?'还有 '+pending+' 项未通过':'按当前已记录范围',activeCoverage.length?passed/activeCoverage.length:0],['当前生效策略',snapshot.active||'未建立',snapshot.policies.length+' 个版本 · '+snapshot.evaluations.length+' 次对照',0],['用户补报',r?.userReportedFailures||0,'交付后失败观察 '+(r?.postDeliveryFailures||0)+' 条',0]].map(([title,value,note,p])=>`<div class="card"><small>${e(title)}</small><strong style="${String(value).length>16?'font-size:19px':''}">${e(value)}</strong><small>${e(note)}</small><div class="bar"><i style="width:${p*100}%"></i></div></div>`).join('');
const attribution=r?.workAttribution;
$('work-attribution').innerHTML=attribution?`<header><h2>${e(attribution.title)}</h2><span class="badge">已复核的历史归因</span></header><p class="readiness">${e(attribution.scope)}</p><div class="columns"><div><h3>已记录的命令在做什么</h3><table><thead><tr><th>工作</th><th>占用时间</th></tr></thead><tbody>${attribution.groups.map(g=>`<tr><td><b>${e(g.title)}</b><details><summary>${g.count} 条记录 · 查看结果</summary>${e(g.note)}</details></td><td><b>${(g.unionMs/60000).toFixed(1)} 分</b></td></tr>`).join('')}</tbody></table><p class="readiness">${e(attribution.measurement)}</p></div><div><h3>定位到的效率问题</h3>${attribution.findings.map(f=>`<article><b>${e(f.title)}</b><p>${e(f.detail)}</p><details><summary>依据</summary><small>${e(f.evidence)}</small></details></article>`).join('')}</div></div>${attribution.agents?.length?`<h3>四个开发代理分别花了多久</h3><div class="scroll"><table><thead><tr><th>代理 / 实际工作</th><th>轮次区间</th><th>推理条目</th><th>工具调用</th><th>仍待归因</th></tr></thead><tbody>${attribution.agents.map(a=>`<tr><td><b>${e(a.agent.split('/').at(-1))}</b><br><small>${e(a.work)}</small></td><td>${(a.turnMs/60000).toFixed(1)} 分</td><td>${(a.reasoningMs/60000).toFixed(1)} 分</td><td>${(a.commandMs/60000).toFixed(1)} 分</td><td>${(a.unattributedMs/60000).toFixed(1)} 分</td></tr>`).join('')}</tbody></table></div><p class="readiness">${e(attribution.agentMeasurement)}</p>`:''}<details><summary>尚未归因的范围与逐条记录</summary><p>${e(attribution.remaining)}</p><small>${e(attribution.evidence)}</small></details>`:'<h2>工作归因</h2><p>尚无已复核的工作归因。时间戳覆盖另列在采集详情中。</p>';
$('run-state').textContent=label(r?.status||'未开始');$('tasks').innerHTML=tasks.map(t=>`<div class="task"><i class="dot ${e(t.state)}"></i><div><b>${e(r.nodes.find(n=>n.id===t.node)?.title||t.node)}</b><small>${e(t.agent||'待分配')} · 就绪等待 ${t.initialQueueMs===null?'尚未就绪':seconds(t.initialQueueMs)}${t.reason?' · '+e(t.reason):''}</small></div><span class="badge">${e(label(t.state))}</span></div>`).join('')||'<p class="empty">暂无执行任务。</p>';
const duration=Math.max(1,(r?.finished||Date.now())-(r?.started||Date.now()));$('timeline').innerHTML=(r?.spans||[]).slice(-30).map(s=>`<div class="timeline-row"><span title="${e(s.label+' · '+label(s.status))}">${e(s.agent+' · '+s.label)}</span><div class="track"><i class="${e(s.status)}" style="left:${Math.max(0,(s.started-r.started)/duration*100)}%;width:${Math.max(.2,Math.min(100,((s.finished||Date.now())-s.started)/duration*100))}%"></i></div><small>${s.finished?seconds(s.finished-s.started):'运行中'}</small></div>`).join('')||'<p class="empty">尚无调用记录。</p>';
$('coverage').innerHTML=coverage.length?'<table><thead><tr><th>行为 / 证据层</th><th>结果</th></tr></thead><tbody>'+coverage.map(c=>`<tr><td><b>${e(c.requirement)}</b><br><small>${e(c.layer)}</small><details><summary>查看依据</summary>${e(c.evidence||'尚未记录')}${c.addedAfterStart?'<br>开工后新发现':''}</details></td><td class="${c.status==='failed'?'bad':c.status==='unknown'?'warning':''}">${e(c.cancelled?'已取消（保留原结果）':label(c.status))}</td></tr>`).join('')+'</tbody></table>':'<p class="empty">未定义行为检查，不能据此声明产品完成。</p>';
const kinds=Object.entries(r?.byKind||{}),max=Math.max(1,...kinds.map(([,v])=>v.inclusiveMs));$('timing').innerHTML=`<p>记录跨度（含中断等待） <b>${seconds(duration)}</b> · 命令覆盖时长（重叠去重） <b>${seconds(r?.observedUnionMs||0)}</b></p><p class="muted">前者不是实际开发工时，后者只含有完整起止记录的命令。两者之差不能当作浪费或模型思考时间。下方按调用者标签累计，旧 verification 混有构建和 RSI，不能当作产品测试占比。</p>`+kinds.map(([k,v])=>`<div class="ratio"><span>${e(k)}</span><div class="bar"><i style="width:${v.inclusiveMs/max*100}%"></i></div><span>${seconds(v.inclusiveMs)}</span></div>`).join('');
const a=r?.activity;if(a){const names={activityMs:'有条目记录',inTurnUnattributedMs:'轮次内待归属',pauseMs:'明确暂停',outsideUnattributedMs:'轮次外待归属'};const colors={activityMs:'#397468',inTurnUnattributedMs:'#c69339',pauseMs:'#899095',outsideUnattributedMs:'#c65c57'};$('timing').innerHTML=`<p>记录跨度 <b>${seconds(a.spanMs)}</b> · 旧命令记录覆盖 <b>${seconds(a.commandUnionMs)}</b></p><p>新增条目覆盖 <b>${seconds(a.additionalActivityMs)}</b>；这里只显示日志覆盖，不表示工作内容已归因。</p>`+Object.entries(a.partition).map(([k,v])=>`<div class="ratio"><span>${names[k]}</span><div class="bar"><i style="width:${a.spanMs?v/a.spanMs*100:0}%;background:${colors[k]}"></i></div><span>${seconds(v)}</span></div>`).join('')+`<details><summary>查看最长的未归属区间</summary>`+a.gaps.slice(0,8).map(g=>`<p>${new Date(g.started).toLocaleString()} — ${new Date(g.finished).toLocaleTimeString()} · ${seconds(g.finished-g.started)} · ${g.kind==='in-turn-unknown'?'轮次内':'轮次外'}</p>`).join('')+`</details><p class="readiness">活动含日志记录的 reasoning / response 条目生命周期；轮次内空白仍待归属。请求级遥测另列 API 与流事件。旧 verification 标签不作为测试时间。</p>`;$('timeline').innerHTML='<p class="readiness">各 Agent 的轮次区间；右侧是该 Agent 已记录活动的累计覆盖时间。</p>'+a.agents.map(agent=>`<div class="timeline-row"><span>${e(agent.agent)}</span><div class="track">${agent.turnWindows.map(([start,end])=>`<i style="left:${(start-a.start)/Math.max(1,a.spanMs)*100}%;width:${(end-start)/Math.max(1,a.spanMs)*100}%"></i>`).join('')}</div><small>${seconds(agent.activityMs)}</small></div>`).join('')+'<details><summary>最近的活动与时间依据</summary>'+a.rows.slice(-25).map(x=>`<p>${e(x.agent)} · ${e(x.kind)} · ${x.finished===null?'未收到结束':seconds(x.finished-x.started)}<br><small>${e(x.evidence)}</small></p>`).join('')+'</details>';const phase=a.phases.at(-1);if(phase)$('run-state').textContent=({paused:'产品开发暂停',discussion:'讨论 / harness 维护',development:'产品开发阶段'})[phase.state];}
$('active-policy').textContent='生效：'+(snapshot.active||'无');$('evaluations').innerHTML=snapshot.evaluations.map(v=>`<article><h3>${e(v.candidate)}</h3><p><span class="badge">${v.status==='running'?'对照运行中':v.comparison.eligible?'满足晋升条件':v.status==='completed'?'未达晋升条件':'对照未完成'}</span> ${v.samples} / ${v.expected} 次执行</p><div class="bar"><i style="width:${v.samples/v.expected*100}%"></i></div><p class="readiness">${e(v.suite)} · ${e(v.baseline)} → ${e(v.candidate)}</p><details><summary>对照结果</summary><p>${e(v.comparison.reason)}</p>${(v.comparison.results||[]).map(x=>`<p>${e(x.split)}：${x.baseline.toFixed(3)} → ${x.candidate.toFixed(3)}；增益 ${x.gain.toFixed(3)}</p>`).join('')}</details></article>`).join('')||'<p class="empty">尚无真实候选对照。机制示例在独立数据库运行，未计入这里。</p>';
$('policies').innerHTML=snapshot.policies.map(p=>`<article><b>${e(p.id)}</b> ${p.id===snapshot.active?'<span class="badge">当前生效</span>':''}<small style="display:block">${e(p.parent?'基于 '+p.parent:'初始版本')}</small><p>${e(p.hypothesis)}</p></article>`).join('');$('promotions').innerHTML=snapshot.promotions.length?'<h3>采用历史</h3>'+snapshot.promotions.map(p=>`<p>${p.evaluation?'晋升':'回滚'}：${e(p.previous)} → ${e(p.next)}<br><small>${e(p.reason)}</small></p>`).join(''):'<p class="readiness">尚未晋升真实项目策略。</p>';$('timestamp').textContent='记录更新时间：'+new Date(snapshot.generatedAt).toLocaleString()+' · '+(r?.activity?.sources?.length||0)+' 个会话已接入';document.querySelectorAll('details').forEach((d,i)=>{d.open=expanded[i]||false});if(!$('plan').classList.contains('hidden'))graph();freshness();document.body.dataset.ready='true'}
function freshness(){const age=Date.now()-snapshot.generatedAt;$('freshness').textContent=age>45000?'更新已停止 · 显示最后记录':'采集在线 · '+Math.max(0,Math.floor(age/1000))+' 秒前';$('freshness').classList.toggle('warning',age>45000)}
window.updateProfile=data=>{if(data.generatedAt===snapshot.generatedAt){freshness();return}snapshot=data;render()};render();let loading=false;function refresh(){if(loading)return;loading=true;const script=document.createElement('script');script.src=feed+'?t='+Date.now();script.onload=script.onerror=()=>{loading=false;script.remove();freshness()};document.head.appendChild(script)}setInterval(()=>{refresh();freshness()},3000);refresh();
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));['execution','rsi','plan'].forEach(id=>$(id).classList.toggle('hidden',id!==button.dataset.tab));if(button.dataset.tab==='plan')graph()});$('dag-source').onchange=graph;$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.dataset.theme='dark';
</script></body></html>
